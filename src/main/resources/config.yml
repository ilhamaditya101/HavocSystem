# Chance values are percentages from 0.0 to 100.0
fishing:
  mending-chance: 1.0

evoker:
  totem-chance: 100.0

events:
  mending:
    duration-seconds: 3600
    boost: 5.0
    announcement: "&6[HAVOC] &eMending Boost dimulai! Chance mancing meningkat."
    title: "&6MENDING BOOST"
    subtitle: "&eChance Mending meningkat!"
    bossbar: "&6Mending Boost &eaktif"
  totem:
    duration-seconds: 3600
    boost: 5.0
    announcement: "&6[HAVOC] &eTotem Boost dimulai! Chance Totem meningkat."
    title: "&6TOTEM BOOST"
    subtitle: "&eChance Totem meningkat!"
    bossbar: "&6Totem Boost &eaktif"

roleplay:
  announcement: "&5[HAVOC] &dEvent Roleplay dimulai!"
  title: "&5ROLEPLAY"
  subtitle: "&dPersiapkan karakter kalian!"

# Barter shop event. Edit trades in-game with /shop edit.
shop:
  event:
    duration-seconds: 3600
    announcement: "&a[HAVOC] &fBarter Shop telah dibuka! Gunakan &e/shop&f untuk barter."
    title: "&aBARTER SHOP"
    subtitle: "&eTukar item selama event berlangsung!"
    bossbar: "&aHavoc Barter Shop"
    ended-announcement: "&c[HAVOC] Barter Shop telah ditutup."
    stopped-announcement: "&c[HAVOC] Barter Shop dihentikan oleh admin."
  offers: {}

# Havoc Teleport: semua player online berpindah setelah seluruh pesan ActionBar selesai.
teleport:
  delay-seconds: 10 # waktu minimum sebelum teleport; animasi tetap harus selesai
  world: world # Dipakai jika command koordinat dijalankan dari console.
  announcement: "&6[HAVOC] Havoc Teleport dimulai."
  completed-announcement: "&a[HAVOC] Semua player berhasil diteleportasikan."
  effects:
    darkness:
      duration-seconds: 5
      amplifier: 0 # 0 = level I, 1 = level II
    levitation:
      duration-seconds: 3
      amplifier: 0
  actionbar:
    typing-speed-ticks: 2 # jeda per karakter; 1 tick = 0.05 detik
    pause-between-ticks: 20
    messages:
      - "&6Incoming transmission..."
      - "&fAll players are being summoned."
      - "&cPrepare for teleportation..."
  completion:
    title: "&c&lHAVOC"
    subtitle: "&fYou have been teleported!"
    fade-in: 10
    stay: 50
    fade-out: 10
