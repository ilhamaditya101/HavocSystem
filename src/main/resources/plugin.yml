name: Havoc
version: 1.1.2
main: id.havoc.HavocPlugin
api-version: '1.21'
author: Havoc
description: Havoc Hardcore System
commands:
  havoc:
    description: Open Havoc Hardcore System
    aliases: [hvc]
    usage: /havoc [reload]
  shop:
    description: Open the Havoc barter shop
    usage: /shop [edit|stop]
permissions:
  havoc.admin:
    description: Allows using Havoc menus and controls
    default: op
